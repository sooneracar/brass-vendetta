<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Brass Vendetta — VFX Canlı Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0a08; color: #f0d7a8; font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 14px; padding: 16px;
  }
  canvas {
    border: 2px solid #7a5828; border-radius: 10px; cursor: pointer;
    box-shadow: 0 18px 50px rgba(0,0,0,0.85); max-width: 100%; height: auto;
  }
  .bar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;
    background: #1a130e; border: 1px solid #4a351c; padding: 10px 16px; border-radius: 8px;
    font-size: 13px;
  }
  button {
    background: linear-gradient(180deg, #d89b3c, #8c5616); color: #120b05;
    border: 1px solid #ffd584; padding: 7px 14px; border-radius: 6px;
    font-weight: 700; cursor: pointer;
  }
  button.sec { background: #2a2018; color: #f0d7a8; border-color: #6a4c28; }
  label { display: flex; align-items: center; gap: 6px; }
  #status { font-size: 12px; color: #c7a97b; }
</style>
</head>
<body>
  <canvas id="c" width="840" height="540"></canvas>
  <div class="bar">
    <button id="playBtn">VS Çarpışmasını Oynat (Space)</button>
    <button id="modeBtn" class="sec">Mod: Oyun İçi Işık (Add)</button>
    <label>Hız (FPS): <input id="fps" type="range" min="16" max="50" value="32" /><span id="fpsV">32</span></label>
    <label>Boyut: <input id="scale" type="range" min="0.8" max="2.4" step="0.1" value="1.5" /><span id="scaleV">1.5x</span></label>
    <label>Sarsıntı: <input id="shake" type="checkbox" checked /></label>
  </div>
  <div id="status">Tahtada istediğin bir yere tıkla veya Space tuşuna bas — efekt tıkladığın karoda patlar.</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

const sheet = new Image();
let loaded = false;
sheet.onload = () => { loaded = true; trigger(canvas.width / 2, canvas.height / 2); };
sheet.onerror = () => { statusEl.textContent = 'HATA: assets/vfx/vfx_vs_clash.png bulunamadı. Önce python pack_vfx.py çalıştır.'; };
sheet.src = 'assets/vfx/vfx_vs_clash.png?t=' + Date.now();

let addBlend = true;
let fps = 32;
let scale = 1.5;
let useShake = true;
let effects = [];
let shakeAmt = 0;

document.getElementById('fps').oninput = e => { fps = +e.target.value; document.getElementById('fpsV').textContent = fps; };
document.getElementById('scale').oninput = e => { scale = +e.target.value; document.getElementById('scaleV').textContent = scale + 'x'; };
document.getElementById('shake').onchange = e => { useShake = e.target.checked; };
document.getElementById('modeBtn').onclick = e => {
  addBlend = !addBlend;
  e.target.textContent = addBlend ? 'Mod: Oyun İçi Işık (Add)' : 'Mod: Ham Siyah Zemin (Normal)';
};
document.getElementById('playBtn').onclick = () => trigger(canvas.width / 2, canvas.height / 2);

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  trigger((e.clientX - r.left) * (canvas.width / r.width), (e.clientY - r.top) * (canvas.height / r.height));
});
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); trigger(canvas.width / 2, canvas.height / 2); }
});

function trigger(x, y) {
  if (!loaded) return;
  effects.push({ x, y, t: 0 });
  if (useShake) shakeAmt = 10;
}

function drawMockBoard() {
  const g = ctx.createRadialGradient(420, 270, 40, 420, 270, 480);
  g.addColorStop(0, '#2a1c12');
  g.addColorStop(1, '#0c0806');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cols = 5, rows = 4, cw = 136, ch = 108, gap = 8;
  const ox = (canvas.width - (cols * cw + (cols - 1) * gap)) / 2;
  const oy = (canvas.height - (rows * ch + (rows - 1) * gap)) / 2;

  for (let c = 0; c < cols; c++) {
    for (let r = 0; r < rows; r++) {
      const x = ox + c * (cw + gap);
      const y = oy + r * (ch + gap);
      ctx.fillStyle = c === 2 ? '#2b1d10' : '#181310';
      ctx.strokeStyle = c === 2 ? '#b88332' : '#4a3723';
      ctx.lineWidth = c === 2 ? 2 : 1.5;
      ctx.fillRect(x, y, cw, ch);
      ctx.strokeRect(x, y, cw, ch);

      ctx.fillStyle = c === 2 ? '#ffd27a' : '#7b6650';
      ctx.font = '700 22px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(c === 2 ? (r === 1 || r === 2 ? 'VS' : 'WILD') : ['A','K','Q','J'][r], x + cw / 2, y + ch / 2);
    }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  ctx.save();
  if (shakeAmt > 0.2) {
    ctx.translate((Math.random() - 0.5) * shakeAmt, (Math.random() - 0.5) * shakeAmt);
    shakeAmt *= 0.86;
  }
  drawMockBoard();

  if (loaded && effects.length) {
    const cell = sheet.width / 4;
    ctx.globalCompositeOperation = addBlend ? 'lighter' : 'source-over';
    effects = effects.filter(ef => {
      ef.t += dt * fps;
      const f = Math.floor(ef.t);
      if (f >= 16) return false;
      const sx = (f % 4) * cell;
      const sy = Math.floor(f / 4) * cell;
      const sz = cell * scale;
      ctx.drawImage(sheet, sx, sy, cell, cell, ef.x - sz / 2, ef.y - sz / 2, sz, sz);
      return true;
    });
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
